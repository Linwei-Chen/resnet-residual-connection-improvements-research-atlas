question: "从 2015 年前驱到 2026-08-13，ResNet 中残差连接有哪些可核验的结构与训练机制改进，它们解决什么问题、证据强度如何、边界与代价是什么？"
objects: "卷积残差网络中的捷径路径、残差分支、两路合并、跨块路径，以及直接服务于恒等信号传播的初始化与归一化机制"
tasks: "图像分类为共同评测主线，兼顾检测/分割等迁移证据；机制分析、消融、优化稳定性与效率比较"
contexts: "研究型读者；以 ResNet/CNN 谱系为核心，跨架构工作仅作机制桥接或边界"
mechanism_scope: "算子次序与恒等映射；投影/下采样；随机路径；门控/加权/注意力；多分支与跨层聚合；缩放/初始化/无归一化；可逆连接"
outcomes: "优化与梯度传播、准确率与稳健性、计算/参数/内存代价、适用条件、失效模式、可复现性与跨任务迁移"
time_window: "奠基工作至 2026-08-13"
languages: ["英文", "中文"]
source_families: ["正式会议与期刊", "官方报告与标准", "作者项目与代码"]
publication_statuses: ["同行评议", "预印本", "官方报告"]
must_cover_axes: ["七类查询家族", "七条冻结主要路线", "最高已核验证据覆盖层级", "时间线", "评测与迁移", "反证、消融与复现", "版本与出版状态"]
exclusions:
  - "仅将 ResNet 用作骨干且不修改残差连接的应用论文"
  - "仅改变卷积算子、网络深度/宽度或训练配方而没有可分离连接机制的工作"
  - "Transformer 专属残差技巧；无 ResNet/CNN 证据者不进入主体"
  - "同一成果的重复版本，以正式且元数据最完整版本为主"
  - "无法核验一手入口、只有二手转述或证据不足的候选"
cutoff_date: "2026-08-13"
target_level: "L2"
current_level: "L2"
scope_version: "1.0"
scope_frozen_at: "2026-08-13"
coverage_definition: "七类查询家族均有记录；每条路线完成前向和后向追踪并具奠基/代表、前沿、评价或明确缺口；两个独立补漏轮次边际新增率均低于 5%；核心条目深读和主张审计完成。"
known_long_tail_risk: "大量任务特定、实验室内部或低影响残差块微变体可能不被纳入；以机制不可替代性而非数量决定收录。"
